<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="{{ ctx.root_prefix }}style.css">
<script>
  // Resolve theme before first paint to avoid a flash of the wrong mode.
  (function () {
    var systemDark = matchMedia("(prefers-color-scheme: dark)");
    function apply() {
      document.documentElement.dataset.theme =
        localStorage.getItem("theme") || (systemDark.matches ? "dark" : "light");
    }
    apply();
    systemDark.addEventListener("change", function () {
      if (!localStorage.getItem("theme")) apply();
    });
  })();
</script>
<script defer src="{{ ctx.root_prefix }}doc.js"></script>
<script defer src="{{ ctx.root_prefix }}search.js"></script>
