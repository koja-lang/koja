<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{ c.name }} — Koja Docs</title>
  {% include "head.html" %}
</head>
<body>

{% include "header.html" %}

<div class="frame">
{% include "sidebar.html" %}

<main class="content" id="content">
  <div class="page-header">
    <h1>{{ c.name }}</h1>
    <span class="kind-chip">const</span>
  </div>

  {% if let Some(doc) = c.doc %}
  <div class="detail-doc">{{ doc|md }}</div>
  {% endif %}
</main>
</div>

</body>
</html>
