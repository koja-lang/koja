<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{ f.name }} — Koja Docs</title>
  {% include "head.html" %}
</head>
<body>

{% include "header.html" %}

<div class="frame">
{% include "sidebar.html" %}

<main class="content" id="content">
  <div class="page-header">
    <h1>{{ f.name }}</h1>
    <span class="kind-chip">fn</span>
  </div>

  <div class="detail-signature codeblock"><code>{{ f.signature_html()|safe }}</code></div>

  {% if let Some(doc) = f.doc %}
  <div class="detail-doc">{{ doc|md }}</div>
  {% endif %}
</main>
</div>

</body>
</html>
