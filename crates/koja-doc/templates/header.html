<a class="skip-link" href="#content">Skip to content</a>

<header class="topbar">
  <button
    class="rail-toggle"
    type="button"
    aria-label="Toggle navigation"
    aria-controls="rail"
    aria-expanded="false">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
      <path d="M3 6h18M3 12h18M3 18h18" />
    </svg>
  </button>

  <a class="brand" href="{{ ctx.root_prefix }}index.html">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">{% if ctx.project_name.is_empty() %}koja{% else %}{{ ctx.project_name }}{% endif %}</span>
    <span class="brand-suffix">docs</span>
  </a>

  {% if let Some(pkg) = ctx.current_package %}
  <select
    class="package-select"
    aria-label="Package"
    onchange="window.location.href = this.value;">
    {% for pref in ctx.packages %}
    <option
      value="{{ ctx.root_prefix }}{{ pref.name }}/index.html"
      {% if pref.name == *pkg %}selected{% endif %}>
      {{ pref.name }}
    </option>
    {% endfor %}
  </select>
  {% endif %}

  <div class="topbar-search">
    <input
      type="search"
      id="doc-search"
      autocomplete="off"
      spellcheck="false"
      placeholder="/ to search"
      role="combobox"
      aria-label="Search documentation"
      aria-autocomplete="list"
      aria-expanded="false"
      aria-controls="doc-search-results"
      data-root-prefix="{{ ctx.root_prefix }}">
    <div id="doc-search-results" class="search-results" role="listbox" aria-label="Search results"></div>
  </div>

  <button class="theme-toggle" type="button" aria-label="Toggle theme">
    <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4" />
    </svg>
  </button>
</header>
