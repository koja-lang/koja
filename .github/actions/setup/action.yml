name: Setup toolchain
description: >
  Install the pinned Rust toolchain and LLVM 21, export the llvm-sys
  environment, and restore the shared cargo cache.

inputs:
  components:
    description: Comma-separated rustup components to install (e.g. "rustfmt, clippy")
    default: ""
  cache-key:
    description: Shared key for the cargo cache, so jobs with the same key reuse one cache per OS
    default: ci

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.94.1"
        components: ${{ inputs.components }}

    # LLVM 21 is not in the runner distro's own repos, so add apt.llvm.org.
    - name: Install LLVM 21 (apt)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.asc > /dev/null
        codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
        echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-21 main" \
          | sudo tee /etc/apt/sources.list.d/llvm-21.list
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake pkg-config \
          llvm-21-dev libpolly-21-dev clang-21 libclang-21-dev \
          zlib1g-dev libzstd-dev libtinfo-dev libxml2-dev libffi-dev libz3-dev
        echo "LLVM_SYS_211_PREFIX=$(llvm-config-21 --prefix)" >> "$GITHUB_ENV"

    - name: Install LLVM 21 (brew)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install llvm@21
        echo "LLVM_SYS_211_PREFIX=$(brew --prefix llvm@21)" >> "$GITHUB_ENV"
        echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

    - name: Restore cargo cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
